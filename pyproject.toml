[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claudemonitor"
version = "0.2.0"
description = "See what Claude is running on your machine (CPU, memory), how many tokens it has used, and kill it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
claudemonitor = "claudemonitor.cli:main"

[tool.setuptools]
packages = ["claudemonitor"]
